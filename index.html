<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Daily Brief - 欧美AI资讯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e8e8e8;
            line-height: 1.6;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #888; font-size: 1.1em; }
        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .nav a {
            color: #00d4ff;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 25px;
            transition: all 0.3s;
        }
        .nav a:hover, .nav a.active {
            background: rgba(0,212,255,0.1);
            border-color: #00d4ff;
        }
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 1.4em;
            color: #00d4ff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .selector-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        .selector-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            color: #aaa;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        .selector-item:hover {
            background: rgba(0,212,255,0.1);
            border-color: #00d4ff;
            color: #fff;
        }
        .selector-item.today {
            background: rgba(0,212,255,0.2);
            border-color: #00d4ff;
            color: #fff;
            font-weight: bold;
        }
        .selector-item.this-week {
            background: rgba(123,44,191,0.2);
            border-color: #7b2cbf;
            color: #fff;
            font-weight: bold;
        }
        .latest-section {
            background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(123,44,191,0.1));
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(0,212,255,0.2);
            text-align: center;
        }
        .latest-title {
            font-size: 1.5em;
            color: #fff;
            margin-bottom: 20px;
        }
        .latest-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .latest-link {
            background: rgba(0,212,255,0.2);
            color: #00d4ff;
            padding: 15px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        .latest-link:hover {
            background: rgba(0,212,255,0.3);
            transform: translateY(-2px);
        }
        .footer {
            text-align: center;
            padding: 40px 0;
            color: #666;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 40px;
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.8em; }
            .selector-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Daily Brief</h1>
            <p class="subtitle">欧美AI资讯 · 每日更新 · 中文呈现</p>
        </header>
        
        <nav class="nav">
            <a href="/" class="active">首页</a>
            <a href="/daily/2026-02-25.html">最新每日</a>
            <a href="/weekly/2026-week08.html">最新每周</a>
        </nav>

        <div class="latest-section">
            <div class="latest-title">📰 最新资讯</div>
            <div class="latest-links">
                <a href="/daily/2026-02-25.html" class="latest-link">今日资讯 →</a>
                <a href="/weekly/2026-week08.html" class="latest-link">本周热点 →</a>
            </div>
        </div>

        <div class="section">
            <div class="section-title">📅 选择日期查看每日资讯</div>
            <div class="selector-grid" id="daily-selector">
                <!-- Daily items will be auto-generated -->
                <a href="/daily/2026-02-25.html" class="selector-item today">2月24日<br><small>今天</small></a>
            </div>
        </div>

        <div class="section">
            <div class="section-title">🔥 选择周次查看热点汇总</div>
            <div class="selector-grid" id="weekly-selector">
                <!-- Weekly items will be auto-generated -->
                <a href="/weekly/2026-week08.html" class="selector-item this-week">第8周<br><small>本周</small></a>
            </div>
        </div>

        <footer class="footer">
            <p>AI Daily Brief · 美国区域高级助理出品</p>
            <p>数据来源：TechCrunch, The Verge, NYT, Reuters, Bloomberg等欧美媒体</p>
            <p>每日10:00更新 · 每周一10:00更新</p>
        </footer>
    </div>

    <script>
        // Auto-generate date selectors for last 30 days
        const dailySelector = document.getElementById('daily-selector');
        const today = new Date('2026-02-24');
        
        for (let i = 1; i <= 30; i++) {
            const date = new Date(today);
            date.setDate(date.getDate() - i);
            
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            const displayMonth = date.getMonth() + 1;
            const displayDay = date.getDate();
            
            const link = document.createElement('a');
            link.href = `/daily/${dateStr}.html`;
            link.className = 'selector-item';
            link.innerHTML = `${displayMonth}月${displayDay}日`;
            dailySelector.appendChild(link);
        }

        // Auto-generate week selectors for last 12 weeks
        const weeklySelector = document.getElementById('weekly-selector');
        const currentWeek = 8;
        const currentYear = 2026;
        
        for (let i = 1; i <= 12; i++) {
            let week = currentWeek - i;
            let year = currentYear;
            
            if (week <= 0) {
                week = 52 + week;
                year = currentYear - 1;
            }
            
            const link = document.createElement('a');
            link.href = `/weekly/${year}-week${String(week).padStart(2, '0')}.html`;
            link.className = 'selector-item';
            link.innerHTML = `第${week}周<br><small>${year}年</small>`;
            weeklySelector.appendChild(link);
        }
    </script>
</body>
</html>
